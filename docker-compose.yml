version: '3.8'

services:
  # MySQL 8.0 with Spatial GIS Extensions
  mysql:
    image: mysql:8.0
    container_name: chara-chhavani-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --explicit_defaults_for_timestamp=1
    environment:
      MYSQL_ROOT_PASSWORD: NewPassword@123
      MYSQL_DATABASE: chara_chhavani_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pNewPassword@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chara-net

  # ASP.NET Core 8.0 WebAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chara-chhavani-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=chara_chhavani_db;CharSet=utf8mb4;"
      DB_USERNAME: root
      PASSWORD: NewPassword@123
    ports:
      - "5000:5000"
    networks:
      - chara-net

  # Web Admin Dashboard Static Nginx Server
  web-admin:
    image: nginx:alpine
    container_name: chara-chhavani-web-admin
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./apps/web-admin:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - chara-net

volumes:
  mysql_data:
    name: chara-chhavani-mysql-data

networks:
  chara-net:
    name: chara-chhavani-network
